name: Weekly NBA Update

# Renders the graphs and commits them; app-host deploys new commits on main by itself
# (app-host/scripts/autodeploy.sh polls GitHub, since the box has no public SSH).
on:
  schedule:
    - cron: '0 14 * * 2' # Tuesdays 14:00 UTC (9am CDT / 8am CST), matching "typically on Tuesdays" on the site
  workflow_dispatch: # allow manual trigger
    inputs:
      dry_run:
        description: 'Render and update files for tomorrow, but do not commit (for testing)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          plotly_get_chrome -y  # kaleido needs Chrome to render PNGs

      - name: Run weekly update
        run: python scripts/weekly_update.py ${{ inputs.dry_run && '$(date -u -d tomorrow +%F)' || '' }}

      - name: Keep dry-run graphs
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: graphs
          path: |
            .standings/*.png
            .head_to_head/*.png
            .conference_battle/*.png
          include-hidden-files: true

      - name: Commit and push
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A img src
          WEEK=$(grep -m1 -oE '<h2>Week [0-9]+' src/web/nba-standings.html | sed 's/.*Week //')
          git commit -m "Add week ${WEEK} graphs"
          git push origin main
