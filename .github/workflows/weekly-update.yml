name: Weekly NBA Update

# Renders the graphs and commits them; app-host deploys new commits on main by itself
# (app-host/scripts/autodeploy.sh polls GitHub, since the box has no public SSH).
on:
  schedule:
    - cron: '0 14 * * 2' # Tuesdays 14:00 UTC (9am CDT / 8am CST), matching "typically on Tuesdays" on the site
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  weekly-update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          plotly_get_chrome -y  # kaleido needs Chrome to render PNGs

      - name: Run weekly update
        run: python scripts/weekly_update.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A img src
          WEEK=$(grep -m1 -oE '<h2>Week [0-9]+' src/web/nba-standings.html | sed 's/.*Week //')
          git commit -m "Add week ${WEEK} graphs"
          git push origin main
